name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - android/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tempo-de-tela-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Tag v*: APK release assinado, anexado na Release do GitHub.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Faltam os secrets de assinatura (RELEASE_KEYSTORE_BASE64 etc.)"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > release.jks

      - name: Build release APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName=${{ github.ref_name }}

      - name: Delete decoded keystore
        if: always()
        run: rm -f release.jks

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/tempo-de-tela-${{ github.ref_name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/tempo-de-tela-${{ github.ref_name }}.apk
          generate_release_notes: true
