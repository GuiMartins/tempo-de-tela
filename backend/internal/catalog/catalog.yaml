# Catálogo domínio → app → categoria.
#
# Cada domínio vale para ele e todos os subdomínios; vence o sufixo mais longo
# (youtubei.googleapis.com é YouTube mesmo com googleapis.com em "sistema").
# Categoria com ignore: true não entra no tempo de tela (telemetria, atualizações,
# CDNs compartilhadas, anúncios). gap_min: quanto tempo sem consultas fecha uma sessão.
# O app Android acrescenta regras e apps próprios por cima deste arquivo.

categories:
  - {id: video, label: Vídeo, gap_min: 10}
  - {id: social, label: Redes sociais, gap_min: 5}
  - {id: games, label: Jogos, gap_min: 10}
  - {id: messages, label: Mensagens, gap_min: 4}
  - {id: music, label: Música, gap_min: 10}
  - {id: ai, label: Inteligência artificial, gap_min: 8}
  - {id: study, label: Estudo e trabalho, gap_min: 8}
  - {id: shopping, label: Compras, gap_min: 5}
  - {id: other, label: Outros, gap_min: 5}
  - {id: system, label: Sistema, ignore: true}

