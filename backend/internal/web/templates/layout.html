{{define "top"}}<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo de Tela</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='18' rx='3' fill='%233b6fd8'/%3E%3Crect x='12' y='25' width='8' height='3' rx='1' fill='%233b6fd8'/%3E%3Cpath d='M16 9v5l3 2' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light dark; font: 1rem/1.45 system-ui, sans-serif; --accent: #3b6fd8; --muted: GrayText; --line: color-mix(in srgb, CanvasText 15%, transparent); }
  body { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; background: Canvas; color: CanvasText; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.5rem; }
  nav { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  a { color: var(--accent); }
  h2 { margin-top: 2.5rem; font-size: 1.2rem; }
  small, .muted { color: var(--muted); }
  dl { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 0; }
  dd { margin: .2rem 0 0; font-size: 1.2rem; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; font-size: .9rem; }
  .table { overflow-x: auto; }
  input, textarea, button { font: inherit; }
  input:not([type=checkbox]), textarea { padding: .35rem .5rem; border: 1px solid var(--line); border-radius: .35rem; background: Field; color: FieldText; box-sizing: border-box; }
  textarea { width: 100%; max-width: 28rem; }
  button { padding: .35rem .8rem; border-radius: .35rem; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  button.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; }
  form.stack { display: grid; gap: .9rem; max-width: 32rem; }
  form.stack label { display: grid; gap: .25rem; }
  form.stack label.check { display: flex; gap: .5rem; align-items: center; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .msg { padding: .6rem .9rem; border-radius: .4rem; margin: 1rem 0; }
  .ok { background: color-mix(in srgb, #2e9d57 18%, Canvas); }
  .err { background: color-mix(in srgb, #d23c3c 18%, Canvas); }
  .name { width: 11rem; }
  code { font-size: .92em; overflow-wrap: anywhere; }
  details summary { cursor: pointer; }
</style>
</head>
<body>
